name: compilar

# Se dispara en push a main y en pull requests. Los tres sistemas se compilan
# siempre, no solo cuando cambian ficheros de uno de ellos: el fallo que duele
# es el que aparece en el sistema que no tocas nunca.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Las dos dependencias externas van fijadas por SHA en fetch-deps.sh, asi que
  # esto no decide de donde se fia, solo evita que apt pregunte.
  DEBIAN_FRONTEND: noninteractive

jobs:
  linux:
    name: linux (ubuntu, pruebas completas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias del sistema
        run: scripts/setup-deps.sh

      - uses: actions/cache@v4
        with:
          path: |
            build/cache
            build/lq
          key: deps-${{ runner.os }}-${{ hashFiles('scripts/fetch-deps.sh') }}

      # make engine no baja nada: depende de un sello que pone fetch-deps.sh, y
      # sin este paso falla con "No rule to make target .patches-applied".
      - name: Descargas
        run: make deps

      - name: Motor
        run: make engine

      - name: Generador, editor y datos
        run: make bsp edit

      # El runner tiene 2 nucleos y dibuja por software con llvmpipe, asi que
      # 6 s de reloj son muchos menos frames que en una maquina normal. El
      # smoke test mide el brillo del escaparate en una captura, y con tan pocos
      # frames la captura sale antes de que se encienda. Se le da mas margen.
      - name: Todas las pruebas
        env:
          SETTLE: "25"
        run: make test

      - name: Paquete
        run: make portable

      - name: Adjuntar a la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/direkt-portable-linux.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: direkt-portable-linux
          path: build/direkt-portable-linux.tar.gz

  macos:
    name: macos (sin ventana)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # Homebrew ya viene en el runner. El make de serie es el 3.81, que no
      # entiende de .SHELLFLAGS, asi que se instala el de brew.
      #
      # fteqcc no se instala: no esta en brew y no hace falta, porque progs.dat
      # va versionado en el repo. Es bytecode, y el motor lo interpreta igual en
      # los tres sistemas. En Linux, donde si hay fteqcc, se recompila igual.
      - name: Dependencias
        run: brew install make cmake pkg-config sdl2

      - uses: actions/cache@v4
        with:
          path: |
            build/cache
            build/lq
          key: deps-${{ runner.os }}-${{ hashFiles('scripts/fetch-deps.sh') }}

      - name: Descargas
        run: make deps

      - name: Motor
        run: make engine

      - name: Generador, editor y datos
        run: make bsp edit

      # En macOS no hay Xvfb ni forma de tener contexto de GL sin sesion
      # grafica, asi que aqui no se prueba el arranque del motor: se prueba
      # todo lo que no necesita ventana. El arranque se prueba en linux.
      - name: Pruebas que no necesitan ventana
        run: make bsp-test editor-test

      - name: Paquete
        run: make portable DIREKT_OS=macos

      - name: Adjuntar a la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/direkt-portable-macos.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: direkt-portable-macos
          path: build/direkt-portable-macos.tar.gz

  windows:
    name: windows (msys2/mingw)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # En Windows no hay ni make ni gcc de serie. MSYS2 los trae, y ademas da
      # bash, que es lo que necesitan los scripts del repo.
      #
      # El make que se pide es el de MSYS ("make"), no el de mingw
      # ("mingw-w64-x86_64-make"), porque el segundo instala un binario llamado
      # mingw32-make y el Makefile del repo llama a "make" a secas. El gcc si
      # es el de mingw, que es el que genera el .exe.
      #
      # El shell "msys2 {0}" no existe hasta que MSYS2 esta instalado, asi que
      # los pasos que lo usan llevan su shell puesto de forma explicita. No se
      # pone en defaults.run porque ese valor se aplica a todos los pasos del
      # trabajo, incluidos los que son acciones.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            make
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-opengl
            zip

      - uses: actions/cache@v4
        with:
          path: |
            build/cache
            build/lq
          key: deps-${{ runner.os }}-${{ hashFiles('scripts/fetch-deps.sh') }}

      - name: Descargas
        shell: msys2 {0}
        run: make deps

      - name: Motor
        shell: msys2 {0}
        run: make engine

      - name: Generador, editor y datos
        shell: msys2 {0}
        run: make bsp edit

      - name: Pruebas que no necesitan ventana
        shell: msys2 {0}
        run: make bsp-test editor-test

      - name: Paquete
        shell: msys2 {0}
        run: make portable DIREKT_OS=windows

      - name: Adjuntar a la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/direkt-portable-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: direkt-portable-windows
          path: build/direkt-portable-windows.zip
